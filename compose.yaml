services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tribunpass
      POSTGRES_USER: tribunpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribunpass -d tribunpass"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgres://tribunpass:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/tribunpass?sslmode=disable
      DB_MAX_OPEN: ${DB_MAX_OPEN:-10}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SIMULATOR_SECRET: ${SIMULATOR_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
volumes:
  pgdata:
